name: CI

on:
  pull_request:
    branches: [release/1.0.0]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # No --coverage yet: the 80% threshold isn't met (tracked in #31).
      # Switch to `npm run test:coverage` once that closes.
      - run: npm test -- --run

      - run: npm run build
